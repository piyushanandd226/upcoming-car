<main class="edit-page"><nav><a routerLink="/home" class="brand"><span>⌁</span> Upcoming <b>Cars</b></a><a routerLink="/table-list">← Cancel and return</a></nav><section class="edit-intro"><p class="eyebrow">VEHICLE MANAGEMENT</p><h1>Refine the details.</h1><p>Keep your listing accurate, current and ready for the next interested driver.</p></section><form (ngSubmit)="onSubmit()" class="edit-card"><div class="heading"><div><p class="eyebrow">EDIT VEHICLE</p><h2>{{ car.carName || 'Vehicle details' }}</h2></div><span>Listing #{{ carId }}</span></div><div class="fields"><label>Car name<input name="carName" [(ngModel)]="car.carName" required></label><label>Model number<input name="modelNo" [(ngModel)]="car.modelNo"></label><label>Vehicle type<select name="carType" [(ngModel)]="car.carType"><option value="">Select type</option><option>Electric</option><option>Hybrid</option><option>Performance</option></select></label><label>Colour<select name="color" [(ngModel)]="car.color"><option value="">Select colour</option><option>Red</option><option>Black</option><option>Silver</option></select></label><label>Starting price<input type="number" name="price" [(ngModel)]="car.price"></label><label>Launch offer<input type="number" name="offer" [(ngModel)]="car.offer"></label><label>Manufacturing starts<input type="date" name="startManufcat" [(ngModel)]="car.startManufcat"></label><label>Delivery date<input type="date" name="deliverydate" [(ngModel)]="car.deliverydate"></label></div><div class="actions"><a routerLink="/table-list">Discard changes</a><button type="submit">Save vehicle <span>→</span></button></div></form><footer>© 2026 Piyush Kumar Anand. All rights reserved.</footer></main>
