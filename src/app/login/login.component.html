<div id="login">
    <div class="login-wrapper">
        <div class="container-fluid">
            <div id="login-row" class="row justify-content-center align-items-center min-vh-100">
                <div id="login-column" class="col-lg-5 col-md-6 col-sm-8 col-10">
                    <div id="login-box" class="card shadow-lg rounded-lg">

                        <!-- HEADER -->
                        <div class="card-header text-center bg-gradient text-white rounded-top">
                            <h3 class="mb-1 fw-700">Welcome Back</h3>
                            <p class="small mb-0 opacity-85">Sign in to your account</p>
                        </div>

                        <!-- BODY -->
                        <div class="card-body">
                            <form #loginform="ngForm" id="login-form" class="form" (ngSubmit)="doLogin()">
                                <small class="text-danger d-block mb-3" *ngIf="msg">{{ msg }}</small>

                                <!-- Username -->
                                <div class="form-group mb-3">
                                    <label for="username" class="form-label fw-600">Username</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-user"></i></span>
                                        <input type="text" name="username" id="username"
                                               class="form-control form-control-modern"
                                               placeholder="Enter your username"
                                               [(ngModel)]="user.username"
                                               required #username="ngModel"
                                               [ngClass]="{ 'is-invalid': loginform.submitted && username.invalid }">
                                    </div>
                                </div>

                                <!-- Password -->
                                <div class="form-group mb-3">
                                    <label for="password" class="form-label fw-600">Password</label>
                                    <div class="input-group">
                                        <span class="input-group-text"><i class="fas fa-lock"></i></span>
                                        <input type="password" name="password" id="password"
                                               class="form-control form-control-modern"
                                               placeholder="Enter your password"
                                               [(ngModel)]="user.password"
                                               required minlength="10"
                                               #password="ngModel"
                                               [ngClass]="{ 'is-invalid': loginform.submitted && password.invalid }">
                                    </div>
                                </div>

                                <!-- Remember Me -->
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" id="remember-me" name="remember-me">
                                    <label class="form-check-label" for="remember-me">Remember me</label>
                                </div>

                                <!-- Submit Button -->
                                <button type="submit" class="btn btn-primary w-100 fw-600 mb-3">Sign In</button>

                                <!-- Links -->
                                <div id="register-link" class="text-center">
                                    <p class="small mb-2">
                                        Don't have an account?
                                        <a [routerLink]="['/registration']" class="text-primary fw-600">Register here</a>
                                    </p>

                                    <div class="mt-3 pt-3 border-top">
                                        <a [routerLink]="['/notification']" class="btn btn-sm btn-outline-secondary me-2">Notifications</a>
                                        <a [routerLink]="['/addcar']" class="btn btn-sm btn-outline-secondary">Add Car</a>
                                    </div>
                                </div>
                            </form>
                        </div>

                    </div>
                </div>
            </div>
        </div>

        <footer class="login-footer">
            <p>&copy; 2025 piyushkumaranand. All rights reserved.</p>
        </footer>
    </div>
</div>
