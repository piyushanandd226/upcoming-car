<main class="vehicle-page"><nav><a routerLink="/home" class="brand"><span>⌁</span> Upcoming <b>Cars</b></a><a routerLink="/table-list">← Back to cars</a></nav><section class="page-intro"><p class="eyebrow">INVENTORY STUDIO</p><h1>Add a new car.</h1><p>Give buyers a clear, polished first look at what is coming next.</p></section><form #carform="ngForm" (ngSubmit)="addCar()" class="vehicle-card"><div class="form-heading"><h2>Vehicle details</h2><span>Step 1 of 1</span></div><p *ngIf="msg" class="message">{{ msg }}</p><div class="fields"><label>Car name<input name="carName" [(ngModel)]="car.carName" required placeholder="e.g. Taycan Turbo GT"></label><label>Model number<input name="modelNo" [(ngModel)]="car.modelNo" placeholder="Model or trim"></label><label>Vehicle type<select name="carType" [(ngModel)]="car.carType"><option value="">Select type</option><option>Electric</option><option>Hybrid</option><option>Performance</option></select></label><label>Colour<select name="color" [(ngModel)]="car.color"><option value="">Select colour</option><option>Red</option><option>Black</option><option>Silver</option></select></label><label>Starting price<input type="number" name="price" [(ngModel)]="car.price" placeholder="0"></label><label>Launch offer<input type="number" name="offer" [(ngModel)]="car.offer" placeholder="0"></label><label>Manufacturing starts<input type="date" name="startManufcat" [(ngModel)]="car.startManufcat"></label><label>Delivery date<input type="date" name="deliverydate" [(ngModel)]="car.deliverydate"></label></div><label class="upload">Vehicle image<input type="file" accept="image/*" (change)="onFileChanged($event)"><span>{{ uploadedFileName || 'Choose a high-quality image' }}</span></label><img *ngIf="imgURL" [src]="imgURL" class="preview" alt="Selected vehicle preview"><button type="submit">Publish vehicle <span>→</span></button></form><footer>© 2026 Piyush Kumar Anand. All rights reserved.</footer></main>
