<div class="page-wrapper bg-red p-t-180 p-b-100 font-robo">
    <div class="wrapper wrapper--w960">
        <div class="card card-2">
            <div class="card-heading"></div>

            <div class="card-body">
                <h2 class="title">Adding Car</h2>

                <!-- ERROR MESSAGE -->
                <div *ngIf="msg" class="alert alert-danger">{{ msg }}</div>

                <!-- FILE SELECTED MESSAGE -->
                <div *ngIf="uploadedFileName" class="alert alert-info">
                    Selected file: {{ uploadedFileName }}
                </div>

                <form #carform="ngForm" (ngSubmit)="addCar()">

                    <!-- ROW 1 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text" placeholder="Id"
                                       name="carId" [(ngModel)]="car.carId">
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text" placeholder="Name"
                                       name="carName" [(ngModel)]="car.carName">
                            </div>
                        </div>
                    </div>

                    <!-- ROW 2 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2 js-datepicker"
                                       type="text" placeholder="StartManufcat"
                                       name="startManufcat" bsDatepicker
                                       [(ngModel)]="car.startManufcat">
                                <i class="zmdi zmdi-calendar-note input-icon js-btn-calendar"></i>
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <div class="rs-select2 js-select-simple select--no-search">
                                    <select name="carType" [(ngModel)]="car.carType">
                                        <option>CarType</option>
                                        <option>Non Ac</option>
                                        <option>AC</option>
                                        <option>Other</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ROW 3 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2 js-datepicker"
                                       type="text" placeholder="EndManufat"
                                       name="endManufat" bsDatepicker
                                       [(ngModel)]="car.endManufat">
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <div class="rs-select2 js-select-simple select--no-search">
                                    <select name="color" [(ngModel)]="car.color">
                                        <option>Color</option>
                                        <option>Yellow</option>
                                        <option>Red</option>
                                        <option>Green</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- ROW 4 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2 js-datepicker"
                                       type="text" placeholder="StartReg"
                                       name="startReg" bsDatepicker
                                       [(ngModel)]="car.startReg">
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text" placeholder="Price"
                                       name="price" [(ngModel)]="car.price">
                            </div>
                        </div>
                    </div>

                    <!-- ROW 5 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2 js-datepicker"
                                       type="text" placeholder="EndReg"
                                       name="endReg" bsDatepicker
                                       [(ngModel)]="car.endReg">
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text"
                                       placeholder="DiscountOnReg"
                                       name="discountOnReg"
                                       [(ngModel)]="car.dicountOnRegistration">
                            </div>
                        </div>
                    </div>

                    <!-- ROW 6 -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2 js-datepicker"
                                       type="text" placeholder="Deliverydate"
                                       name="deliverydate" bsDatepicker
                                       [(ngModel)]="car.deliverydate">
                            </div>
                        </div>

                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text"
                                       placeholder="Offer" name="offer"
                                       [(ngModel)]="car.offer">
                            </div>
                        </div>
                    </div>

                    <!-- MODEL NO -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <input class="input--style-2" type="text" placeholder="modelNo"
                                       name="modelNo" [(ngModel)]="car.modelNo">
                            </div>
                        </div>
                    </div>

                    <!-- IMAGE UPLOAD -->
                    <div class="row row-space">
                        <div class="col-2">
                            <div class="input-group">
                                <label class="file-label">Upload Image</label>
                                <input type="file" accept="image/*" (change)="onFileChanged($event)">
                                <img *ngIf="imgURL" [src]="imgURL" height="200" width="200"
                                     class="img-preview">
                            </div>
                        </div>
                    </div>

                    <!-- SUBMIT BUTTON -->
                    <div class="p-t-30 text-center">
                        <button class="btn btn-primary btn-block btn--radius" type="submit">
                            Submit
                        </button>
                    </div>

                </form>

            </div>
        </div>
    </div>
</div>
